<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 56" role="img" aria-labelledby="title description">
  <title id="title">Some(Scripting) logo</title>
  <desc id="description">The word Some followed by parentheses containing a terminal prompt and cursor.</desc>
  <defs>
    <linearGradient id="word" x1="2" y1="15" x2="164" y2="43" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2A67B7"/>
      <stop offset="0.62" stop-color="#3F82D9"/>
      <stop offset="1" stop-color="#62ACF5"/>
    </linearGradient>
    <linearGradient id="cursor" x1="100" y1="17" x2="139" y2="41" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFCA69"/>
      <stop offset="1" stop-color="#FF9F43"/>
    </linearGradient>
  </defs>

  <text x="2" y="41" fill="url(#word)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="36" font-weight="780" letter-spacing="-2.2">Some</text>
  <text x="78" y="42" fill="url(#word)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="39" font-weight="760">(</text>
  <path d="M101 17.5L116 28L101 38.5" fill="none" stroke="url(#cursor)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="121" y="39" width="15" height="4.6" rx="2.3" fill="#3F8DDF"/>
  <text x="140" y="42" fill="url(#word)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="39" font-weight="760">)</text>
</svg>
